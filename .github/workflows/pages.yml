name: Publicar en GitHub Pages

# El sitio es estático: no hay build. Se sube la carpeta tal cual.
# `configure-pages` con enablement:true activa Pages la primera vez usando el
# token del propio flujo, así no hace falta tocar la configuración a mano.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, que gane el último y no se pisen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # upload-pages-artifact excluye .git por sí solo (usa tar --exclude-vcs).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
